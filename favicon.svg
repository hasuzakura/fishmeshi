<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- ヘッダーのロゴマーク（build.js の LOGO_MARK）と同じ図形。
       タブの背景は白のことも黒のこともあるので、濃紺の角丸を必ず敷く。
       単体ファイルなのでCSS変数は使えない。色は style.css の
       bg / text / accent / bg2 の各変数と同じ値をここに直接書いている。
       線はそのまま縮めると細くて消えるため、stroke-width を 2.1 から 2.6 に太らせてある。
       注意：XMLのコメント内にハイフン2つを書くとパースエラーになり、
       ブラウザがSVGを一切描画しない。CSS変数名をそのまま書かないこと。 -->
  <rect width="64" height="64" rx="14" fill="#0e2a40" />
  <g transform="translate(3 15.9) scale(0.8056)">
    <g fill="none" stroke="#eff8fd" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
      <path d="M3.5 6 V14.5" /><path d="M8.5 6 V14.5" /><path d="M13.5 6 V14.5" />
      <path d="M3.5 14.5 Q8.5 19.5 13.5 14.5" />
      <path d="M8.5 17.5 V34" />
      <path d="M59.5 6 C63.4 10 64.6 15 64.6 19.5 H59.5 Z" />
      <path d="M62 19.5 V34" />
    </g>
    <g transform="translate(37 20)">
      <path d="M-11 0 C-4 -10 10 -11 17.5 0 C10 11 -4 10 -11 0 Z" fill="#3fc4f7" />
      <path d="M-7 0 L-20 -8 L-20 8 Z" fill="#3fc4f7" />
      <circle cx="10.5" cy="-2.6" r="2.1" fill="#0a2033" />
    </g>
  </g>
</svg>
